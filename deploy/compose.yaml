services:
  superagent-sec:
    platform: ${SUPERAGENT_CONTAINER_PLATFORM:-}
    build:
      context: ..
      dockerfile: deploy/App.Dockerfile
      args:
        RUNTIME_IMAGE: ${SUPERAGENT_RUNTIME_IMAGE:-superagent-sec-runtime:stable}
    image: ${SUPERAGENT_APP_IMAGE:-superagent-sec-app:local}
    restart: unless-stopped
    # Optional operator-managed secrets/configuration. This file is never
    # copied into the image or committed to the application checkout.
    env_file:
      - ${SUPERAGENT_EXTERNAL_ENV_FILE:-/dev/null}
    ports:
      - "${SUPERAGENT_BIND_HOST:-127.0.0.1}:${SUPERAGENT_HOST_WEB_PORT:-3184}:3184"
    environment:
      SUPERAGENT_PROFILE: ${SUPERAGENT_PROFILE:-superagent-sec}
      SUPERAGENT_APP_DIR: /opt/superagent-sec
      SUPERAGENT_PROJECTS_DIR: /var/lib/superagent/projects
      SUPERAGENT_PROJECT_ID: ${SUPERAGENT_PROJECT_ID:-default}
      SUPERAGENT_WORKSPACE: ${SUPERAGENT_WORKSPACE:-/var/lib/superagent/projects/${SUPERAGENT_PROJECT_ID:-default}/workspace}
      SUPERAGENT_STATE_DIR: /var/lib/superagent/state
      DSH_HOME: /var/lib/superagent/dsh-home
      DSH_SUPERAGENT_HOME: /var/lib/superagent/dsh-home
      DSH_SUPERAGENT_ACCESS_TOKEN_FILE: /var/lib/superagent/secrets/web-token
      DSH_SUPERAGENT_BACKEND_PORT: 3182
      DSH_SUPERAGENT_WEB_HOST: 0.0.0.0
      DSH_SUPERAGENT_WEB_PORT: 3184
      DSH_SUPERAGENT_WEB_ADVERTISE_HOST: ${SUPERAGENT_WEB_ADVERTISE_HOST:-127.0.0.1}
      # If a custom key is supplied, this must be a path visible inside the
      # container. The default is empty so the persistent mounted key is
      # generated automatically on first start.
      SUPERAGENT_SSH_KEY_FILE: ${SUPERAGENT_SSH_KEY_FILE:-}
      SUPERAGENT_SSH_STRICT_HOST_KEY_CHECKING: ${SUPERAGENT_SSH_STRICT_HOST_KEY_CHECKING:-accept-new}
      # Optional complete DSH patch supplied by the operator. Model/provider
      # settings belong to that external patch or to DSH global settings.
      SUPERAGENT_DSH_PATCH_FILE: ${SUPERAGENT_DSH_PATCH_FILE:-}
      HTTP_PROXY: ${SUPERAGENT_HTTP_PROXY:-}
      HTTPS_PROXY: ${SUPERAGENT_HTTPS_PROXY:-}
      ALL_PROXY: ${SUPERAGENT_ALL_PROXY:-}
      NO_PROXY: ${SUPERAGENT_NO_PROXY:-127.0.0.1,localhost}
      npm_config_registry: ${SUPERAGENT_PNPM_REGISTRY:-}
    volumes:
      # The target project and all runtime state stay on the host. Application
      # code and its generated lib/ are immutable layers in the app image.
      - ${SUPERAGENT_PROJECTS_DIR:-./.container-data/projects}:/var/lib/superagent/projects
      - ${SUPERAGENT_DATA_DIR:-./.container-data}/state:/var/lib/superagent/state
      - ${SUPERAGENT_DATA_DIR:-./.container-data}/dsh-home:/var/lib/superagent/dsh-home
      - ${SUPERAGENT_DATA_DIR:-./.container-data}/secrets:/var/lib/superagent/secrets
      # This path is used only when SUPERAGENT_DSH_PATCH_FILE points to
      # /run/superagent/dsh.patch.yml inside the container.
      - ${SUPERAGENT_DSH_PATCH_HOST_FILE:-./.container-data/dsh.patch.yml}:/run/superagent/dsh.patch.yml:ro
